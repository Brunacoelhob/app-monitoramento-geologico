name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execucoes antigas da mesma branch quando chega um push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tipos, testes unitarios e de integracao)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Banco real so para os testes de integracao (nunca o de desenvolvimento)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iot_test
      DATABASE_URL_TESTE: postgresql://postgres:postgres@127.0.0.1:5432/iot_test
      JWT_SECRET: segredo-de-ci-com-mais-de-32-caracteres-xxxxxxxx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Checagem de tipos
        run: npx tsc --noEmit
      - name: Testes unitarios
        run: npm test
      - name: Testes de integracao
        run: npx jest --config test/jest-e2e.json
      - name: Build
        run: npm run build

  frontend:
    name: Frontend (testes e build de producao)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - run: npm ci
      - name: Testes unitarios
        run: npx ng test --watch=false
      - name: Build de producao
        run: npm run build

  docker:
    name: Imagens Docker e compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Valida o docker-compose
        run: docker compose config -q
        env:
          DB_USER: postgres
          DB_PASS: ci
          JWT_SECRET: segredo-de-ci-com-mais-de-32-caracteres-xxxxxxxx
      - name: Constroi as imagens
        run: docker compose build
        env:
          DB_USER: postgres
          DB_PASS: ci
          JWT_SECRET: segredo-de-ci-com-mais-de-32-caracteres-xxxxxxxx
