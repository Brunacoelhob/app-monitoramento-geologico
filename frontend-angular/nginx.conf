server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Cabecalhos basicos de seguranca
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # A API fica atras do mesmo endereco: o navegador nunca fala direto com o
  # backend, entao nao ha CORS e a porta 3000 nem precisa estar exposta.
  location /api/ {
    # Uploads de imagens (ate 10 x 5 MB) e relatorios grandes
    client_max_body_size 55m;
    proxy_buffering off;
    proxy_pass http://backend:3000;
    # Necessario para o canal em tempo real (SSE): conexao longa, sem buffer
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Arquivos com hash no nome podem ficar em cache por muito tempo
  location ~* \.(js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rotas do Angular (SPA): qualquer caminho volta para o index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
