<app-cabecalho-pagina
  icone="device_thermostat"
  titulo="Temperatura das estações"
  descricao="Leituras dos sensores interno e externo, no período que você escolher."
/>

<section class="filtros" aria-label="Filtros">
  <h2 class="so-leitor">Filtros</h2>
  <app-barra-filtros />

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="campo">
    <mat-label>Origem dos dados</mat-label>
    <mat-select [value]="filtros.origem()" (selectionChange)="mudarOrigem($event.value)">
      <mat-option [value]="null">Reais e simulados</mat-option>
      <mat-option value="REAL">Somente reais</mat-option>
      <mat-option value="SIMULADO">Somente simulados</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="campo">
    <mat-label>Estação</mat-label>
    <mat-select [value]="filtros.estacaoId()" (selectionChange)="mudarEstacao($event.value)">
      <mat-option [value]="null">Todas as estações</mat-option>
      @for (estacao of estacoes.estacoes(); track estacao.id) {
        <mat-option [value]="estacao.id">
          {{ estacao.nome }}{{ estacao.origem === 'SIMULADO' ? ' (simulada)' : '' }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</section>

<nav mat-tab-nav-bar [tabPanel]="painel" class="abas" [mat-stretch-tabs]="false" mat-align-tabs="start" aria-label="Seções de Temperatura">
  @for (aba of abas; track aba.rotulo) {
    <a
      mat-tab-link
      [routerLink]="aba.rota"
      routerLinkActive
      #ativa="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: aba.exato }"
      [active]="ativa.isActive"
    >
      {{ aba.rotulo }}
    </a>
  }
</nav>

<mat-tab-nav-panel #painel class="painel-aba">
  <router-outlet />
</mat-tab-nav-panel>
